services:
  nginx:
    build: nginx/.
    restart: always
    depends_on:
      - client-vite
      - api
    ports:
      - '8080:80'

  client-vite:
    build: client-vite/.
    volumes:
      - /app/node_modules
      - ./client-vite:/app

  db:
    image: postgres
    restart: always
    environment:
      - POSTGRES_PASSWORD=postgres_password
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  api:
    build: api
    depends_on:
      - db
    links:
      - db
    environment:
      - RAILS_DEVELOPMENT_HOSTS=api
      - PIDFILE=/tmp/pids/server.pid
    volumes:
      - ./api:/usr/src/app
    tmpfs:
      - /tmp/pids/
